apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ${INFRA_PG_NS}
type: Opaque
stringData:
  POSTGRES_DB: "${DB_NAME}"
  POSTGRES_USER: "${DB_USER}"
  POSTGRES_PASSWORD: "${DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: cca-secret
  namespace: ${NS}
type: Opaque
stringData:
  LLM_API_KEY: "${LLM_API_KEY}"
  DB_PASSWORD: "${DB_PASSWORD}"
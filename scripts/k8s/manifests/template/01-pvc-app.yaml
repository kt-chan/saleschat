apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: ${NS}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-output
  namespace: ${NS}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests: {storage: 2Gi}
apiVersion: v1
kind: Pod
metadata:
  name: app-upload
  namespace: ${NS}
spec:
  restartPolicy: Never
  containers:
    - name: upload
      image: ${APP_IMAGE}
      imagePullPolicy: ${IMAGE_PULL_POLICY}
      command: ["sleep", "1800"]
      volumeMounts:
        - name: data
          mountPath: /app/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data
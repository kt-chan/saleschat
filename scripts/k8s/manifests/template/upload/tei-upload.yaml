apiVersion: v1
kind: Pod
metadata:
  name: tei-upload
  namespace: ${INFRA_TEI_NS}
spec:
  restartPolicy: Never
  containers:
    - name: upload
      image: ${APP_IMAGE}
      imagePullPolicy: ${IMAGE_PULL_POLICY}
      command: ["sleep", "1800"]
      volumeMounts:
        - name: tei-data
          mountPath: /data
  volumes:
    - name: tei-data
      persistentVolumeClaim:
        claimName: tei-data
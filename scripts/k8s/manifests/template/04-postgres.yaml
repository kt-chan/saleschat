apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${INFRA_PG_NS}
spec:
  serviceName: ${INFRA_PG_SVC}
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${INFRA_PG_SVC}
  namespace: ${INFRA_PG_NS}
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: ${INFRA_PG_PORT}
      targetPort: 5432
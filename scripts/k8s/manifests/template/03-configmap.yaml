apiVersion: v1
kind: ConfigMap
metadata:
  name: cca-config
  namespace: ${NS}
data:
  # DB
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  DB_WRITE_BATCH_SIZE: "500"
  SESSION_TTL: "1800"

  # Embedding
  EMBEDDING_TEI_URL: "${EMBEDDING_TEI_URL}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
  EMBEDDING_TEI_STYLE: "${EMBEDDING_TEI_STYLE}"
  EMBEDDING_TEI_TIMEOUT: "30"
  EMBEDDING_TEI_BATCH_SIZE: "16"
  EMBEDDING_TEI_CONCURRENCY: "8"
  EMBEDDING_TEI_RETRY_MAX: "3"
  EMBEDDING_TEI_RETRY_BACKOFF: "2.0"
  EMBEDDING_TEI_TRUNCATE: "true"
  EMB_CACHE_SIZE: "2000"
  EMBEDDING_SORT_BY_LENGTH: "true"

  # LLM
  LLM_BASE_URL: "${LLM_BASE_URL}"
  LLM_MODEL: "${LLM_MODEL}"
  LLM_MAX_CONCURRENCY: "16"
  LLM_TIMEOUT: "60"
  LLM_RETRY_MAX: "3"
  LLM_RETRY_BACKOFF: "2.0"

  # Runtime
  CLEAR_CACHE_ON_START: "${CLEAR_CACHE_ON_START}"
  STATE_MACHINE_MODE: "${STATE_MACHINE_MODE}"
  LOG_LEVEL: "${LOG_LEVEL}"

  # Paths
  DATA_DIR: "/app/data/${DATA_DIR_BATCH}" 
  OUTPUT_DIR: "/app/output"
  CACHE_DIR: "/app/cache"
  LOG_DIR: "/app/log"
  CALLS_FILE_PATTERN: "${CALLS_FILE_PATTERN}"
  PROMPT_FILE: "/app/prompts.yaml"

  # Retrieval
  ONLINE_TOP_K: "3"
  ONLINE_SIM_THRESHOLD: "0.50"
  HYBRID_MAX_HOPS: "2"
  HYBRID_GOLDEN_WEIGHT: "1.0"
  HYBRID_PG_WEIGHT: "0.9"
  HYBRID_PG_TOP_K: "20"
  HYBRID_GOLDEN_TOP_K_PER_NODE: "2"
  HYBRID_HOP_DECAY: "[1.0, 0.95, 0.85]"
  HYBRID_VOTE_TOP_N: "5"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${INFRA_TEI_DEPLOY}
  namespace: ${INFRA_TEI_NS}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${INFRA_TEI_LABEL}
  template:
    metadata:
      labels:
        app: ${INFRA_TEI_LABEL}
    spec:
      containers:
        - name: tei
          image: ${TEI_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["text-embeddings-router"]
          args:
            # ⚠️ 改：直连本地路径，不用 HF 缓存结构
            - "--model-id"
            - "/data/models/${MODEL_SHORT_NAME}"
            - "--served-model-name"
            - "${MODEL_ID}"
            - "--max-batch-tokens"
            - "4096"
            - "--max-client-batch-size"
            - "32"
            - "--max-concurrent-requests"
            - "64"
            - "--tokenization-workers"
            - "2"
          env:
            # HF_HOME 只用于其他可能的 HF 依赖，TEI 这次不用它找模型
            - name: HF_HOME
              value: /data
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: tei-data
              mountPath: /data
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 6Gi
              nvidia.com/gpu: 1
      volumes:
        - name: tei-data
          persistentVolumeClaim:
            claimName: tei-data
---
apiVersion: v1
kind: Service
metadata:
  name: ${INFRA_TEI_SVC}
  namespace: ${INFRA_TEI_NS}
spec:
  selector:
    app: ${INFRA_TEI_LABEL}
  ports:
    - name: http
      port: ${INFRA_TEI_PORT}
      targetPort: 80
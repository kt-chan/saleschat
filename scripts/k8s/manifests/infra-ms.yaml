apiVersion: v1
kind: Namespace
metadata:
  name: model-service
  labels:
    name: model-service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-model
  namespace: model-service
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-data
  namespace: model-service
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-svc
  namespace: model-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tei
  template:
    metadata:
      labels:
        app: tei
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:89-1.9
          imagePullPolicy: IfNotPresent
          command: ["text-embeddings-router"]
          args:
            - "--model-id"
            - "BAAI/bge-base-zh-v1.5"
            - "--served-model-name"
            - "BAAI/bge-base-zh-v1.5"
            - "--max-batch-tokens"
            - "4096"
            - "--max-client-batch-size"
            - "32"
            - "--max-concurrent-requests"
            - "64"
            - "--tokenization-workers"
            - "2"
          env:
            - name: HF_HOME
              value: /hf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: tei-model
              mountPath: /hf
            - name: tei-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 6Gi
              nvidia.com/gpu: 1
      volumes:
        - name: tei-model
          persistentVolumeClaim:
            claimName: tei-model
        - name: tei-data
          persistentVolumeClaim:
            claimName: tei-data
---
apiVersion: v1
kind: Service
metadata:
  name: tei-svc                 # ← 从 tei 改为 tei-svc
  namespace: model-service
spec:
  selector:
    app: tei
  ports:
    - name: http
      port: 8010                # ← 从 80 改为 8010
      targetPort: 80            # 容器内保持 80
      protocol: TCP
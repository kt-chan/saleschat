apiVersion: v1
kind: Namespace
metadata:
  name: cca
  labels:
    name: cca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cca-config
  namespace: cca
data:
  EMBEDDING_MODEL: "BAAI/bge-base-zh-v1.5"
  EMBEDDING_TEI_URL: "http://tei-svc.model-service.svc.cluster.local:8010/v1/embeddings"  # 旧：http://tei:80/v1/embeddings
  EMBEDDING_TEI_STYLE: "auto"
  EMBEDDING_TEI_TIMEOUT: "30"
  EMBEDDING_TEI_BATCH_SIZE: "16"
  EMBEDDING_TEI_CONCURRENCY: "8"
  EMBEDDING_TEI_RETRY_MAX: "3"
  EMBEDDING_TEI_RETRY_BACKOFF: "2.0"
  EMBEDDING_TEI_TRUNCATE: "true"
  EMBED_CACHE_SIZE: "2000"
  EMBEDDING_SORT_BY_LENGTH: "true"
  DB_HOST: "gv-sql-service.gv.svc.cluster.local"        # 旧：postgres
  DB_PORT: "14003"                                        # 旧：5432
  DB_NAME: "cca_db"
  DB_USER: "cca_user"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  DB_WRITE_BATCH_SIZE: "500"
  SESSION_TTL: "1800"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  LLM_MAX_CONCURRENCY: "16"
  LLM_TIMEOUT: "60"
  LLM_RETRY_MAX: "3"
  LLM_RETRY_BACKOFF: "2.0"
  LLM_TEMPERATURE_LABELING: "0.1"
  LLM_TEMPERATURE_SYNTHESIS: "0.3"
  STATE_MACHINE_MODE: "guide"
  CLEAR_CACHE_ON_START: "false"
  LOG_LEVEL: "INFO"
  DATA_DIR: "/app/data/202610"
  OUTPUT_DIR: "/app/output"
  CACHE_DIR: "/app/cache"
  LOG_DIR: "/app/log"
  CALLS_FILE_PATTERN: "*.jsonl"
  PROMPT_FILE: "/app/prompts.yaml"
  ONLINE_TOP_K: "3"
  ONLINE_SIM_THRESHOLD: "0.50"
  HYBRID_MAX_HOPS: "2"
  HYBRID_GOLDEN_WEIGHT: "1.0"
  HYBRID_PG_WEIGHT: "0.9"
  HYBRID_PG_TOP_K: "20"
  HYBRID_GOLDEN_TOP_K_PER_NODE: "2"
  HYBRID_HOP_DECAY: "[1.0, 0.95, 0.85]"
  HYBRID_VOTE_TOP_N: "5"
  DIALOG_PARSE_MODE: "auto"
  DIALOG_TURN_SEPARATORS: '["；", ";"]'
  DIALOG_ROLE_PREFIXES: '["催收员", "客户", "客服", "坐席", "用户"]'
  DIALOG_ROLE_ALIASES: '{"客服": "催收员", "坐席": "催收员", "用户": "客户"}'
  DIALOG_COLON_PATTERN: "[：:]"
  DIALOG_CUSTOMER_ROLE: "客户"
  DIALOG_AGENT_ROLE: "催收员"
  PROMPT_CUSTOMER_PREFIX: "客户："
  PROMPT_AGENT_PREFIX: "催收员："
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: cca
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-output
  namespace: cca
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cca-app
  namespace: cca
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cca-app
  template:
    metadata:
      labels:
        app: cca-app
    spec:
      containers:
        - name: app
          image: ghcr.io/kt-chan/saleschat-amd64:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.server"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cca-config
            - secretRef:
                name: cca-secret
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: output
              mountPath: /app/output
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: log
              mountPath: /app/log
            - name: prompts
              mountPath: /app/prompts.yaml
              subPath: prompts.yaml
              readOnly: true
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: app-output
        - name: data
          persistentVolumeClaim:
            claimName: app-data
        - name: cache
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: prompts
          configMap:
            name: cca-prompts
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cca-app
  namespace: cca
spec:
  type: ClusterIP
  selector:
    app: cca-app
  ports:
    - port: 8000
      targetPort: 8000
name: Test Model Download

on:
  pull_request:
    paths:
      - 'models-test.txt'
      - 'download_models.sh'
      - '.github/workflows/test-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_PROGRESS_BARS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install --no-cache-dir "huggingface_hub>=0.30"

      # 缓存模型文件：models.txt 不变时直接命中，跳过大文件下载
      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ hashFiles('models.txt') }}
          restore-keys: |
            hf-models-

      - name: Run download_models.sh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x download_models.sh
          ./download_models.sh models.txt

      - name: Verify cache structure + offline resolve
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          hf_home = Path(os.environ["HF_HOME"])
          hub = hf_home / "hub"
          assert hub.is_dir(), f"missing hub dir: {hub}"

          specs = [
              line.split("#", 1)[0].strip()
              for line in Path("models.txt").read_text().splitlines()
              if line.split("#", 1)[0].strip()
          ]
          assert specs, "empty manifest"

          for spec in specs:
              rid, _, rev = spec.partition("@")
              repo_dir = hub / ("models--" + rid.replace("/", "--"))
              assert repo_dir.is_dir(), f"missing cache: {repo_dir}"

              snaps = [p for p in (repo_dir / "snapshots").iterdir() if p.is_dir()]
              assert snaps, f"no snapshot for {rid}"
              for snap in snaps:
                  entries = [p for p in snap.rglob("*") if p.is_file() or p.is_symlink()]
                  assert entries, f"empty snapshot: {snap}"
                  print(f"ok {rid}: {len(entries)} entries @ {snap.name}")

              # 关键：local_files_only=True 强制离线解析，即使环境变量失效也不会联网
              path = snapshot_download(
                  rid,
                  revision=rev or None,
                  cache_dir=str(hf_home),
                  local_files_only=True,
              )
              print(f"offline hit: {rid} -> {path}")

          print("ALL MODEL CHECKS PASSED")
          PY

      - name: Verify idempotency (re-run adds no downloads)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          BEFORE=$(du -sb "$HF_HOME/hub" | cut -f1)
          ./download_models.sh models.txt
          AFTER=$(du -sb "$HF_HOME/hub" | cut -f1)
          DELTA=$((AFTER - BEFORE))
          echo "cache delta: ${DELTA} bytes"
          if (( DELTA > 10240 )); then
              echo "::error::Re-run added ${DELTA} bytes; cache not effective"
              exit 1
          fi
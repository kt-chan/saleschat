name: Build & Push Multi-Arch Docker Image

on:
  # 发布新 Release 时触发双架构构建并推送
  release:
    types: [published]
  # PR 只做构建验证，不推送
  pull_request:
    branches: [main]
  # 允许手动触发，便于重跑
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

name: Build & Push Multi-Arch Docker Image

on:
  # 发布新 Release 时触发双架构构建并推送
  release:
    types: [published]
  # PR 只做构建验证，不推送
  pull_request:
    branches: [main]
  # 允许手动触发，便于重跑
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选：只在正式 Release 时构建，忽略 pre-release
    # 若希望 pre-release 也产出镜像，删除下面这行 if
    if: github.event_name != 'release' || github.event.release.prerelease == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release 事件下确保检出 tag 指向的 commit
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      # GHCR 要求镜像名全小写
      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Release: v1.2.3 -> 1.2.3 / 1.2 / 1 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            # PR / 手动触发时的辅助标签
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Login to GHCR
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify multi-arch manifest
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG"
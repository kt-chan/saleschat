name: Build and Push Container Images

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # 1) 并行构建 + 推送多架构 + 直接导出原生架构 tar 包
  # ==========================================================
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            target: nvidia
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: ascend
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 优化点：通过多 outputs 同时推送（by-digest）并直接打包为本地 tar
      # ==========================================================
      - name: Build, push by digest, and export to Tar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            type=docker,dest=saleschat-${{ matrix.arch_suffix }}.tar
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.target }}-v3
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-v3
          provenance: false
          sbom: false

      - name: Upload Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saleschat-${{ matrix.arch_suffix }}-tar
          path: saleschat-${{ matrix.arch_suffix }}.tar
          retention-days: 3
      # ==========================================================

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # Strip 'sha256:' and write cleanly into a file named after the target
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.target }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================================
  # 2) 合并多架构 manifest 并打上正式 tag
  # ==========================================================
  merge:
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (for metadata context)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 1

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=sha,prefix=sha-,format=short
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCE_ARGS=""
          for f in *; do
            if [ -f "$f" ]; then
              digest_val=$(cat "$f")
              SOURCE_ARGS="${SOURCE_ARGS} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest_val}"
            fi
          done
          echo "Tags: $TAG_ARGS"
          echo "Sources: $SOURCE_ARGS"
          docker buildx imagetools create $TAG_ARGS $SOURCE_ARGS

      - name: Verify multi-arch manifest
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG"

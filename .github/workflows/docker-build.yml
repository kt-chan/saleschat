name: Build and Push Container Images

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_image:
        description: "推送到 GHCR"
        type: boolean
        default: true
      export_tar:
        description: "导出本地 tar 包用于离线交付"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 实际文件名是小写 dockerfile
  DOCKERFILE: ./docker/Dockerfile

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # 1) 双架构并行构建
  #    amd64 → ubuntu-latest (x86_64 原生)
  #    arm64 → ubuntu-24.04-arm (aarch64 原生，避免 QEMU 慢/失败)
  # ==========================================================
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose build outputs
        id: outputs
        run: |
          set -eu
          is_dispatch="${{ github.event_name == 'workflow_dispatch' }}"
          push_img="${{ inputs.push_image }}"
          export_tar="${{ inputs.export_tar }}"
          if [ "$is_dispatch" != "true" ]; then
            push_img="true"; export_tar="true"
          fi

          LINES=""
          if [ "$push_img" = "true" ]; then
            LINES="${LINES}type=image,name=${REGISTRY}/${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true"$'\n'
          fi
          if [ "$export_tar" = "true" ]; then
            LINES="${LINES}type=docker,dest=saleschat-${{ matrix.arch_suffix }}.tar,name=${REGISTRY}/${IMAGE_NAME}-${{ matrix.arch_suffix }}:latest"$'\n'
          fi

          echo "OUTPUTS<<EOF" >> "$GITHUB_OUTPUT"
          printf "%s" "$LINES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.arch_suffix }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ steps.outputs.outputs.OUTPUTS }}
          # 多阶段构建同样使用 cache，加速第二次以后的构建
          cache-from: type=gha,scope=app-${{ matrix.arch_suffix }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch_suffix }}
          provenance: false
          sbom: false

      - name: Package scripts folder
        if: ${{ matrix.arch_suffix == 'amd64' && (github.event_name != 'workflow_dispatch' || inputs.export_tar) }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, zipfile
          exclude = {'.env', '.pf.log'}          # secrets / local runtime logs
          with zipfile.ZipFile('saleschat-scripts.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk('scripts'):
                  for f in files:
                      if f in exclude:
                          continue
                      p = os.path.join(root, f)
                      zf.write(p, os.path.relpath(p, '.'))
          PY
          ls -la saleschat-scripts.zip

      - name: Upload Scripts Artifact
        if: ${{ matrix.arch_suffix == 'amd64' && (github.event_name != 'workflow_dispatch' || inputs.export_tar) }}
        uses: actions/upload-artifact@v4
        with:
          name: saleschat-scripts
          path: saleschat-scripts.zip
          retention-days: 3
          if-no-files-found: error

      - name: Upload Tar Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.export_tar }}
        uses: actions/upload-artifact@v4
        with:
          name: saleschat-${{ matrix.arch_suffix }}-tar
          path: saleschat-${{ matrix.arch_suffix }}.tar
          retention-days: 3
          if-no-files-found: warn

      - name: Export digest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "ERROR: 没有 digest 输出，可能未推送"; exit 1
          fi
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.arch_suffix }}"

      - name: Upload digest
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================================
  # 2) 合并 amd64 + arm64 digests 成多架构 manifest
  # ==========================================================
  merge:
    needs: build
    if: |
      github.event_name != 'workflow_dispatch' || inputs.push_image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (metadata context)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 1

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Verify both architectures present
        run: |
          set -eu
          ls -la /tmp/digests/
          for arch in amd64 arm64; do
            if [ ! -s "/tmp/digests/$arch" ]; then
              echo "ERROR: 缺少 $arch 的 digest"; exit 1
            fi
            echo "$arch: $(cat /tmp/digests/$arch)"
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=sha,prefix=sha-,format=short
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCE_ARGS=""
          for arch in amd64 arm64; do
            digest_val=$(cat "$arch")
            SOURCE_ARGS="${SOURCE_ARGS} ${REGISTRY}/${IMAGE_NAME}@sha256:${digest_val}"
          done
          echo "Tags: $TAG_ARGS"
          echo "Sources: $SOURCE_ARGS"
          docker buildx imagetools create $TAG_ARGS $SOURCE_ARGS

      - name: Verify multi-arch manifest
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting $TAG"
          docker buildx imagetools inspect "$TAG"

      - name: Assert both platforms in manifest
        run: |
          set -eu
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          PLATFORMS=$(docker buildx imagetools inspect "$TAG" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "Manifest platforms: $PLATFORMS"
          echo "$PLATFORMS" | grep -q "linux/amd64" || { echo "缺少 linux/amd64"; exit 1; }
          echo "$PLATFORMS" | grep -q "linux/arm64" || { echo "缺少 linux/arm64"; exit 1; }
          echo "✓ 双架构齐全"
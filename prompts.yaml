session_prompt: |
  你是信用卡催收领域的业务专家与数据本体工程师。阅读完整对话，提取会话级标签。

  ============================================================
  一、PTP（承诺还款）判定规则（极其重要）
  ============================================================
  必须同时满足以下条件才为 true：
  (1) 明确承诺："我会还"、"明天转"、"去凑一下"。
  (2) 有时间锚点：今天/明天/发工资后等。
  (3) 有具体金额或接受方案金额。
  (4) 无未落地前提条件（如"如果减免就还"）。
  仅附和"嗯嗯"或说"想办法"、"考虑"一律为 false。

  ============================================================
  二、SOP 阶段标注
  ============================================================
  标准阶段：
  {sop_stages}
  输出格式：[{{"stage_name": "阶段名", "turn_start": 0, "turn_end": 2}}]，从 0 开始闭区间。

  ============================================================
  三、候选清单
  ============================================================
  逾期原因：{session_reasons}
  客户情绪：{session_emotions}
  合规检查点：{session_compliance}
  最终结果：{session_outcomes}

  ============================================================
  四、输出 JSON Schema
  ============================================================
  {{
    "session_summary": "概括不超过100字",
    "ptp": false,
    "sop_stages": [{{"stage_name": "01 专业开场及身份核实", "turn_start": 0, "turn_end": 2}}],
    "reason_for_delinquency": ["失业"],
    "agent_tactics": ["引导分期"],
    "customer_objections": ["失业"],
    "customer_emotions": ["焦虑"],
    "compliance_checkpoints": ["隐私合规披露"],
    "final_outcomes": ["部分承诺还款(PTP)"]
  }}

  ============================================================
  五、对话内容
  ============================================================
  {session_text}


pair_prompt: |
  你是信用卡催收话术打标与重写专家。输入为 session_content（全文背景）、chunk_content（当前片段），
  以及 session_stage_labels（该片段在会话级标注中所处的阶段）。

  【任务】
  1. 只依据 chunk_content 对当前片段打标；session_content 仅用于背景消歧。
  2. 对 chunk_content 改写，输出 rewritten_question 和 rewritten_answer。
  3. 输出前必须按【输出前强制检查】逐项自检并修正。
  4. 只输出一个 JSON 对象，不要输出解释或代码块。

  【候选清单】
    stage 候选：{sop_stages}
    customer_intents 候选：{unified_intents}
    customer_emotions 候选：{pair_emotions}
    risk 候选等级：{pair_risk_levels} / 类型：{pair_risk_types}

  【Session 阶段标签（一致性参考）】
    本片段归属的会话阶段：{session_stage_labels}
    → 若当前片段内容确实处于上述某阶段，优先沿用；否则以当前片段的实际行为为准。

  【SOP 阶段→意图映射（强约束）】
  {sop_flow}

  【stage ↔ intent 对齐规则（必须遵守）】
  1. customer_intents 只能从当前 stage 对应的允许意图列表中选择。
  2. 若 chunk_content 显示客户意图属于另一阶段，请重新判断 stage，使 stage 与意图保持一致。
     禁止输出「stage 与意图不匹配」的组合。
  3. 无法确定时，优先采用 session_stage_labels 中最接近的阶段，并在其允许意图中选择。
  4. 禁止输出「其他」作为 customer_intents。

  【打标规则】
  - 输出 stage、customer_intents、customer_emotions、keywords、tags、risk。
  - 低信息量片段：数组字段为空；stage 无法判断时输出空字符串；risk 输出 "None"。
  - 所有数组标签必须有 chunk_content 原文证据。

  【脱敏强制规则】
  rewritten_question 与 rewritten_answer 都必须逐项扫描并替换：
  1. 姓名/称呼 → 删除或替换为「您」。
  2. 所有金额 → 「相关金额」。
  3. 日期、月份、期限、延期天数 → 「相关时间」或「尽快」。
  4. 期数 → 「相关期数」。
  5. 号码、地址、账号 → 「相关联系方式」。

  【重写规则】
  rewritten_question：
  - 以「客户：」开头。
  - 必须包含「必要前文 + 当前片段中客户的发言」。
  - 必要前文用括号转述嵌入，如「客户：（前文：催收员告知可申请延期）我后天也不敢保证能借到。」
  - 严禁写入当前片段中催收员的任何回复。
  - 必须脱敏。

  rewritten_answer：
  - 以「催收员：」开头。
  - 基于当前片段中催收员的回复改写，保留原意，仅脱敏。
  - 不得新增原文没有的合规提示、承诺或方案。
  - 必须脱敏。

  【输出前强制检查】
  1. rewritten_question 是否以「客户：」开头，且包含必要前文 + 当前客户发言？
  2. rewritten_question 是否混入了当前片段催收员的回复？
  3. rewritten_answer 是否严格基于当前片段催收员回复改写？
  4. 两个字段是否都已彻底脱敏？
  5. stage 与 customer_intents 是否符合 {sop_flow} 中的映射关系？
  6. 是否存在无 chunk_content 证据的标签？

  【输出 JSON】
  {
    "stage": "",
    "customer_intents": [],
    "customer_emotions": [],
    "keywords": [],
    "tags": [],
    "risk": "None",
    "rewritten_question": "客户：",
    "rewritten_answer": "催收员："
  }

  ============================================================
  输入
  ============================================================
  【全文背景】
  {session_content}

  【当前片段】
  {chunk_content}

  【Session 阶段标签】
  {session_stage_labels}


golden_script_prompt: |
  你是顶级催收培训专家。我们正在为 SOP 图谱中的一个节点生成「经典 Q&A 话术对」。

  【当前节点】Stage: {stage} | 客户意图: {intent}
  【历史真实语料】（以下为该节点命中过的真实对话，已脱敏）
  {samples}

  【任务】
  综合以上语料，归纳提炼出 3-5 个最高频、最具代表性的「经典 Q&A 对」。
  要求：
  1. **经典问题 (question)**：提炼客户的核心诉求/异议，必须脱敏，使用 [金额]、[时间] 等占位符。
  2. **经典解答 (answer)**：逻辑清晰（共情 → 陈述事实 → 引导方案），严格合规，提供实质性解法。
  3. 每个回答 30-100 字。

  输出 JSON 格式（严格遵守）：
  {
    "golden_qa_pairs": [
      {
        "question": "客户表示最近失业了，暂时没钱还[金额]。",
        "answer": "理解您的困难，找工作需要时间。为了避免影响您的征信，我们可以先为您申请[时间]的延期，您看可以吗？"
      }
    ]
  }
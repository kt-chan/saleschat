# prompts.yaml
# 催收场景 LLM 打标 Prompt（Session 级 + Pair 级）
# 所有候选清单由 offline.py 从 config.py 注入，此处不硬编码

session_prompt: |
  你是信用卡催收领域的业务专家与数据本体工程师。
  阅读文末的完整催收对话记录，提取会话级标签。

  ============================================================
  一、跨会话知识图谱合规要求（非常重要）
  ============================================================
  1. 去个人化：禁止姓名、电话、地址、卡号、SSN、身份证号、单位名称。
  2. 去具体数值：禁止具体金额、具体日期、具体时间长度、具体期数。
  3. 业务类别化：若原文包含具体数值或时间，只提取业务类别，
     例如："5000" → "还款金额"，"一个星期" → "短期延期"，"12期" → "分期期数"。
  4. 跨会话可复用：标签应能在不同客户、不同会话中复用。

  ============================================================
  二、SOP 阶段标注
  ============================================================
  标准阶段（优先使用）：
  {sop_stages}

  sop_stages 输出说明：
  - 每个对象包含 stage_name、turn_start、turn_end。
  - turn_start、turn_end 使用输入对话的轮次索引，从 0 开始，闭区间。

  ============================================================
  三、候选清单
  ============================================================
  reason_for_delinquency（逾期原因）候选：
  {session_reasons}

  agent_tactics（坐席策略）候选：
  {session_tactics}

  customer_objections（客户异议）候选：
  {session_objections}

  compliance_checkpoints（合规检查点）候选：
  {session_compliance}

  final_outcomes（最终结果）候选：
  {session_outcomes}

  ============================================================
  四、输出 JSON Schema
  ============================================================
  严格按以下 JSON 格式输出：
  {{
    "session_summary": "一句话概括核心冲突与最终结果，不超过100字",
    "ptp": true/false,
    "sop_stages": [
      {{"stage_name": "专业开场及身份核实", "turn_start": 0, "turn_end": 2}},
      {{"stage_name": "欠款事实确认及情况交互", "turn_start": 3, "turn_end": 5}}
    ],
    "reason_for_delinquency": ["失业", "医疗费用高"],
    "agent_tactics": ["引导分期", "同理心安抚", "确认还款日期"],
    "customer_objections": ["失业", "要求减免"],
    "compliance_checkpoints": ["本人身份确认完成", "隐私合规披露"],
    "final_outcomes": ["全额承诺还款(PTP)"]
  }}

  ============================================================
  五、抽取要求
  ============================================================
  1. 标签原子化、扁平化：单个标签 2~8 个字，禁止嵌套结构。
  2. 优先从候选清单选择原词；确无合适项可按业务逻辑新增。
  3. 宁缺毋滥：只提取真实发生的内容；未触发则输出 []。
  4. 只输出合法 JSON，禁止 Markdown 代码块或额外文字。

  ============================================================
  六、对话内容
  ============================================================
  {session_text}


pair_prompt: |
  你是信用卡催收话术的意图识别与打标专家。
  你将看到两部分输入：
  1. 整通会话全文 session_content：仅作为背景上下文，用于消歧和判断当前片段所处阶段。
  2. 当前对话内容片段 chunk_content：这是你唯一需要精细打标的对象。

  【最重要的一条规则】
  你只能对 chunk_content 本身打标。
  session_content 只是背景参考，禁止把全文其他位置出现的信息写入当前片段的
  stage、customer_intents、agent_actions、keywords、tags、risk。

  如果 chunk_content 本身信息量很低（如寒暄、附和、确认、语气词），
  你必须如实输出低信息量结果，而不是根据全文脑补业务标签。

  ============================================================
  一、低信息量片段处理规则
  ============================================================
  当 chunk_content 只包含寒暄、问候、附和、语气词时：
  - stage：保留当前片段所处阶段。
  - customer_intents：输出 []。
  - agent_actions：输出 []。
  - keywords：输出 []。
  - tags：只允许输出与当前片段直接相关的低信息量标签，如 ["信息模糊", "情绪平稳"]。
  - risk："None"

  ============================================================
  二、跨会话知识图谱合规要求
  ============================================================
  去个人化、去具体数值、去具体日期时间、只提取业务类别。
  禁止："5000"、"一个星期"、"55000"、"张三"。
  允许："还款金额"、"短期延期"、"欠款金额"、"失业状态"。

  ============================================================
  三、候选清单
  ============================================================
  stage 候选（单值字符串）：
  {sop_stages}

  customer_intents 候选：
  {pair_intents}

  agent_actions 候选：
  {pair_actions}

  keywords 候选（业务实体类别，必须脱敏）：
  {pair_keywords}

  tags 候选（抽象归纳标签，必须跨会话可复用）：
  {pair_tags}

  risk 候选等级：{pair_risk_levels}
  risk 类型：{pair_risk_types}

  ============================================================
  四、输出 JSON Schema
  ============================================================
  严格按以下 JSON 格式输出：
  {{
    "stage": "专业开场及身份核实",
    "customer_intents": ["经济困难", "协商分期"],
    "agent_actions": ["同理心安抚", "引导分期"],
    "keywords": ["还款金额", "短期延期"],
    "tags": ["情绪激动", "紧迫感强", "合规正常"],
    "risk": "Low"
  }}

  ============================================================
  五、抽取要求
  ============================================================
  1. 只对 chunk_content 打标，session_content 仅用于背景消歧。
  2. 低信息量片段必须如实输出空数组或低信息量标签，禁止脑补全文业务标签。
  3. 标签原子化、扁平化：单个标签 2~8 个字，禁止嵌套结构。
  4. 优先从候选清单选择原词；确无合适项可按业务逻辑新增。
  5. 只输出合法 JSON，禁止 Markdown 代码块或额外文字。

  ============================================================
  六、输入内容
  ============================================================
  整通会话全文（仅背景参考）：
  {session_content}

  当前对话内容片段（唯一打标对象）：
  {chunk_content}